<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myIOT | Configuration</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="view-config" style="display: flex;">
    <div class="config-container">
      <h2>⚙ DASHBOARD CONFIGURATION</h2>
      <p class="config-desc">Manage your sensor network and warning thresholds</p>

      <div id="config-error" class="config-error"></div>

      <div class="config-tabs">
        <button id="tab-thingspeak" class="tab-btn active">ThingSpeak</button>
        <button id="tab-thresholds" class="tab-btn">Thresholds</button>
      </div>

      <!-- ThingSpeak Form -->
      <form id="config-form" class="config-panel">
        <div class="form-group">
          <label for="config-channel">Channel ID</label>
          <input type="text" id="config-channel" placeholder="e.g. 2812345" required>
        </div>
        <div class="form-group">
          <label for="config-apikey">Read API Key</label>
          <input type="text" id="config-apikey" placeholder="e.g. A1B2C3D4E5F6G7H8" required>
        </div>
        <button type="submit" class="btn-primary">CONNECT SENSORS</button>
        <button type="button" class="btn-secondary" id="config-skip-btn" style="background-color: var(--color-amber); color: var(--color-bg);">SKIP</button>
        <button type="button" class="btn-secondary" id="config-cancel-btn">CANCEL</button>
      </form>

      <!-- Thresholds Form -->
      <form id="threshold-form" class="config-panel hidden">
        
        <h4 style="color: var(--color-primary); margin-bottom: 10px; margin-top: 5px;">🌡️ Suhu (Temperature)</h4>
        <div class="form-group">
          <label for="thresh-temp-warn">Batas Peringatan (°C)</label>
          <input type="number" id="thresh-temp-warn" value="26" required>
        </div>
        <div class="form-group">
          <label for="thresh-temp-alert">Batas Kritis (°C)</label>
          <input type="number" id="thresh-temp-alert" value="30" required>
        </div>

        <h4 style="color: var(--color-secondary); margin-bottom: 10px; margin-top: 15px;">💧 Kelembapan (Humidity)</h4>
        <div class="form-group">
          <label for="thresh-humid-warn">Batas Peringatan (%)</label>
          <input type="number" id="thresh-humid-warn" value="70" required>
        </div>
        <div class="form-group">
          <label for="thresh-humid-alert">Batas Kritis (%)</label>
          <input type="number" id="thresh-humid-alert" value="85" required>
        </div>

        <h4 style="color: var(--color-accent); margin-bottom: 10px; margin-top: 15px;">💨 Kualitas Udara (Air Quality)</h4>
        <div class="form-group">
          <label for="thresh-air-warn">Batas Peringatan (AQI)</label>
          <input type="number" id="thresh-air-warn" value="150" required>
        </div>
        <div class="form-group">
          <label for="thresh-air-alert">Batas Kritis (AQI)</label>
          <input type="number" id="thresh-air-alert" value="300" required>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 20px;">SAVE THRESHOLDS</button>
        <button type="button" class="btn-secondary" id="thresh-cancel-btn">CANCEL</button>
      </form>

    </div>
  </section>

  <script src="js/utils.js"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
