<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myIOT | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="view-auth" style="display: flex; flex-direction: column; min-height: 100vh;">
    <div class="auth-back-nav">
      <a href="/" class="nav-btn nav-btn-outline" style="text-decoration:none;">← Back to Home</a>
    </div>

    <div class="auth-container">
      <div class="auth-logo">
        <h1>📡 myIOT</h1>
        <div class="subtitle">Smart Dashboard</div>
      </div>

      <h2 id="auth-title">OPERATOR LOGIN</h2>

      <div id="auth-error" class="auth-error"></div>

      <form id="auth-form" autocomplete="on">
        <div class="form-group" id="username-group" style="display: none;">
          <label for="auth-username">Username</label>
          <input type="text" id="auth-username" placeholder="operator_name" autocomplete="username">
        </div>

        <div class="form-group">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" placeholder="operator@facility.io" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" id="auth-submit" class="btn-primary">LOGIN</button>
      </form>

      <button id="auth-toggle" class="auth-toggle">Don't have an account? Sign Up</button>
    </div>
  </section>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js?v=2"></script>
</body>
</html>
