<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>myIOT | Admin Panel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section id="view-admin" style="display: flex; flex-direction: column; min-height: 100vh;">
    <header class="dashboard-header">
      <div class="header-left">
        <a href="/" style="text-decoration:none;"><span class="header-brand" style="cursor:pointer">📡 myIOT</span></a>
        <span class="status-badge" style="background:#e74c3c">ADMIN MODE</span>
      </div>
      <div class="header-right">
        <button id="nav-dash-btn" class="btn-icon">📊 DASHBOARD</button>
        <button id="logout-btn" class="btn-icon">⏻ EXIT</button>
      </div>
    </header>
    <main class="dashboard-main" style="padding-top: 20px;">
      <h2>Users Management</h2>
      <table class="admin-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Tokens</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="admin-users-tbody">
          <!-- Populated by JS -->
        </tbody>
      </table>
    </main>
  </section>

  <div id="custom-confirm-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:9999; justify-content:center; align-items:center;">
    <div style="background:#1a1a2e; padding:25px; border-radius:12px; border:1px solid #333; max-width:400px; width:90%; text-align:center; color:#fff; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
      <h3 style="margin-top:0; color:#e74c3c;">Konfirmasi</h3>
      <p id="custom-confirm-message" style="margin-bottom:25px; font-size:16px;">Are you sure?</p>
      <div style="display:flex; justify-content:center; gap:15px;">
        <button id="custom-confirm-cancel" style="padding:10px 20px; border-radius:6px; background:#444; color:#fff; border:none; cursor:pointer; font-weight:bold; transition: background 0.2s;">Batal</button>
        <button id="custom-confirm-ok" style="padding:10px 20px; border-radius:6px; background:#e74c3c; color:#fff; border:none; cursor:pointer; font-weight:bold; transition: background 0.2s;">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <script src="js/utils.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
