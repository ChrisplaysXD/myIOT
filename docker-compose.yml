services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/energy_dashboard
      - SESSION_SECRET=change-this-to-a-64-char-random-string-in-production
      - CSRF_SECRET=another-random-secret-for-csrf-tokens
      - PORT=3000
      - NODE_ENV=production
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=100
      - ACCOUNT_LOCKOUT_ATTEMPTS=5
      - ACCOUNT_LOCKOUT_DURATION_MS=900000
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    # NOT exposed to host, only accessible from app container
    restart: unless-stopped

volumes:
  mongo_data:
